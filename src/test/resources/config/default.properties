# Fallback values used when a key is missing from the env-specific file.
base.url=https://reqres.in
base.path=/api
connection.timeout=15000
socket.timeout=30000
max.retry.count=2
retry.delay.ms=1000
request.logging.enabled=true
response.logging.enabled=true
auth.type=NONE
auth.api.key.name=x-api-key
auth.api.key.value=reqres-free-v1
parallel.thread.count=3
report.extent.path=target/extent-reports/ExtentReport.html

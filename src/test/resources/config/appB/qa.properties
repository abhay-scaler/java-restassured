# Restful Booker has no /api-style path prefix - endpoints are /auth, /booking directly.
base.url=https://restful-booker.herokuapp.com
base.path=

connection.timeout=15000
socket.timeout=30000

http.retry.count=2
test.retry.count=2
retry.delay.ms=1000

request.logging.enabled=true
response.logging.enabled=true

# admin/password123 are Restful Booker's own publicly documented demo
# credentials (fixed, identical for every user of this public API) -
# not a personal secret like reqres.in's per-signup key, so committing
# them directly here is appropriate.
auth.type=BASIC
auth.username=admin
auth.password=password123

report.extent.path=target/extent-reports/ExtentReport.html
parallel.thread.count=3

# Test-only keys below - not read by any production code, only by
# ConfigManagerTests/AppBServiceConfigTests to prove cross-application
# configuration isolation. Named unambiguously (configtestonly, not a
# plausible real service name like "orders") so these can never be
# mistaken for a real service dependency. Harmless to leave.
services.configtestonly.base.url=https://appb-configtestonly.test.example.com
config.override.probe=file-value-appB

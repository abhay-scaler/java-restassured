name: API Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly regression run — 06:00 UTC every day.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to run against"
        required: false
        default: "qa"
        type: choice
        options: [dev, qa, stage]
      suite:
        description: "Suite to run"
        required: false
        default: "smoke"
        type: choice
        options: [smoke, regression]

jobs:
  smoke:
    name: Smoke suite (PR / push) - ${{ matrix.app }}
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      # One app's known external failure (reqres.in 403/429, Restful Booker 418)
      # must not cancel the other app's job before it even runs.
      fail-fast: false
      matrix:
        app: [appA, appB]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run smoke suite
        run: |
          ./mvnw -B clean test -Psmoke -Dapp=${{ matrix.app }} -Denv=qa \
            -Dauth.api.key.value=${{ secrets.QA_API_KEY }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-smoke-${{ matrix.app }}-${{ github.run_number }}
          path: |
            target/allure-results
            target/extent-reports
            target/surefire-reports
          if-no-files-found: ignore

  framework-health:
    name: Framework health validator
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure xmllint is available
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Run validator self-test
        run: ./tools/validate-framework.selftest.sh

      - name: Run framework-health validator
        run: ./tools/validate-framework.sh

  regression:
    name: Regression suite (nightly / manual) - ${{ matrix.app }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      # One app's known external failure (reqres.in 403/429, Restful Booker 418)
      # must not cancel the other app's job before it even runs.
      fail-fast: false
      matrix:
        app: [appA, appB]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run suite
        env:
          RUN_ENV: ${{ github.event.inputs.env || 'qa' }}
          RUN_SUITE: ${{ github.event.inputs.suite || 'regression' }}
        run: |
          ./mvnw -B clean test -P"$RUN_SUITE" -Dapp=${{ matrix.app }} -Denv="$RUN_ENV" \
            -Dauth.api.key.value=${{ secrets.QA_API_KEY }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-regression-${{ matrix.app }}-${{ github.run_number }}
          path: |
            target/allure-results
            target/extent-reports
            target/surefire-reports
          if-no-files-found: ignore
